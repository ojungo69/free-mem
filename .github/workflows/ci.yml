name: CI

on:
  workflow_dispatch:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: vendor/codemem
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.16.0
      - name: Enable and verify pnpm
        run: |
          corepack enable pnpm
          test "$(pnpm --version)" = "11.8.0"
      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile
      - name: Build
        run: corepack pnpm run build
      - name: Typecheck and lint
        run: corepack pnpm run tsc && corepack pnpm run lint
      - name: Typecheck harness
        # harness は --experimental-strip-types で走る＝型は剥がされるだけで検査されない。
        # vendor の依存が入っているこの job でだけ tsc をかけられる
        working-directory: .
        run: vendor/codemem/node_modules/.bin/tsc -p harness/tsconfig.json
      - name: Test with coverage
        run: CI=true corepack pnpm run test:coverage
      - name: Analyze with SonarQube Cloud
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        with:
          projectBaseDir: vendor/codemem
          args: -Dsonar.qualitygate.wait=true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  harness:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.16.0
      - name: Capability matrix self-test
        # PASS 行を必須にする: entry point の起動条件が変わって黙って no-op しても exit 0 になるため
        run: node --experimental-strip-types harness/assemble.ts --self-test | tee /dev/stderr | grep -qx PASS
      - name: Continuity contract tests
        run: node --experimental-strip-types --test harness/continuity/*.test.ts
      - name: Published manifest versions are immutable
        # §13「Adding or removing a required scenario requires a manifest version bump
        # recorded in the evidence file」。test 側は manifest・hash・evidence の 3 つを
        # 突き合わせるが、その 3 つは同じ変更の中で一緒に書き換えられるため、版を据え置いた
        # まま集合を変える経路を塞げない。origin/main に既に載っている版のファイルを
        # 不変の基準として扱い、変更を拒否する（新しい版は新しいファイルで足す）。
        #
        # 列挙は **基準側**（origin/main）から行う。作業ツリー側を列挙すると、公開済みの版を
        # 削除・rename したときに旧 path が一度も比較されず素通りする。
        #
        # push イベントでは fetch 後の origin/main が push 済みの HEAD を指すため diff が
        # 常に空になる。main は PR 経由でしか進まない（PR 側の実行でこの検査は済んでいる）ので、
        # 空振りの実行を残さず pull_request に限定する。
        if: github.event_name == 'pull_request'
        run: |
          git fetch --depth=1 origin main
          status=0
          while read -r f; do
            [ -n "$f" ] || continue
            git diff --exit-code origin/main -- "$f" >/dev/null || {
              echo "::error file=$f::公開済みの版を変更・削除している。scenario 集合を変えるなら新しい版のファイルを追加し、evidence に節を足すこと（§13）"
              status=1
            }
          done <<EOF
          $(git ls-tree -r --name-only origin/main -- harness/schema | grep -E 'capability-scenarios\.v[0-9]+\.json$' || true)
          EOF
          exit $status

      - name: Matrices are regenerated, not hand-edited
        # plan の「Regenerate matrices; never manually edit generated JSON」を CI で強制する。
        # generatedAt は実行ごとに変わるので比較から外す
        run: |
          for cli in claude codex; do
            node --experimental-strip-types harness/assemble.ts "harness/fixtures/$cli" "/tmp/$cli.json"
            diff <(jq 'del(.generatedAt)' "harness/matrix/$cli.json") <(jq 'del(.generatedAt)' "/tmp/$cli.json")
          done

  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_VERSION: "8.30.1"
